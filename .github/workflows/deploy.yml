name: Zero-Downtime CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: mevinumethdam
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: mevinumethdam/gateease-api:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Pull Latest Image from Docker Hub
        run: docker pull mevinumethdam/gateease-api:latest

      - name: Run New Container (Pre-Nginx Setup)
        run: |
          docker stop gateease-api || true
          docker rm gateease-api || true
          docker run -d --name gateease-api -p 3000:3000 mevinumethdam/gateease-api:latest
          
          # Trigger pipeline (My 3rd try)